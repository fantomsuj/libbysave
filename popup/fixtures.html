<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LibbySave popup fixtures</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand"><img src="../assets/icons/icon-48.png" alt=""><div><strong>LibbySave</strong><small>Books → your library</small></div></div>
      <button class="icon-button" aria-label="Open settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg></button>
    </header>
    <main>
      <form class="search-wrap" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <label for="fixtureSearch">Search books</label><input id="fixtureSearch" value="The Power Broker" aria-label="Search books"><button class="clear-button" type="button" aria-label="Clear">×</button>
      </form>
      <div id="fixtureStatus" class="status-banner hidden" role="status"></div>
      <section id="fixtureResult" aria-label="Book result">
        <article class="result-card">
          <div class="cover-shell fixture-cover"><span>THE<br>POWER<br>BROKER<small>Robert A. Caro</small></span></div>
          <div class="result-copy"><span class="match-pill good">Best match</span><h1>The Power Broker</h1><p class="author">Robert A. Caro</p><div class="format">Ebook</div><button class="edit-match">Edit search or choose another match</button></div>
        </article>
        <div class="section-heading availability-heading"><h2>Library availability</h2><span>2 connected</span></div>
        <div id="fixtureLibraries" class="availability-list"></div>
        <button class="button secondary save-button full">Save to Reading List</button>
      </section>
      <section id="fixtureEmpty" class="empty-state callout hidden"><h2></h2><p></p><button class="button primary">Add a library</button></section>
    </main>
    <footer>2 libraries connected</footer>
    <script src="state.js"></script>
    <script src="fixtures.js"></script>
  </body>
</html>
